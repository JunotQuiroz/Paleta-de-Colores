<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLRS - Generador de Paletas de Color</title>
</head>
<body>
    <main>
        <section id="hero" class="hero-section">
            <h1 class="hero-title">CLRS</h1>
            <p class="hero-subtitle">
                Un color puede transmitir <span id="palabra-dinamica">paz</span>
            </p>
        </section>
        <section id="teoria-color" class="teoria-section">
            <h2>El impacto del color</h2>
            <article class="teoria-contenido">
                <p>1</p>
                <p>2</p>
                <p>3</p>
            </article>
        </section>
        <section id="recomendador" class="recomendador-section">
            <h2>Descubre la combinación de colores ideal para tu empresa</h2>
            
            <div class="selector-container">
                <label for="industria-selector">¿A qué industria pertenece tu empresa?</label>
                <select id="industria-selector" name="industria">
                    <option value="" disabled selected>Selecciona una opción...</option>
                    <option value="salud">Salud y Bienestar</option>
                    <option value="medio-ambiente">Medio Ambiente</option>
                    <option value="restaurante">Restaurantes y Gastronomía</option>
                    <option value="turismo">Turismo</option>
                </select>
            </div>
            <div id="resultado-recomendacion" class="resultado-box">
            </div>
        </section>

        <section id="generador" class="generador-section">
            <h2>Generador de paletas de colores</h2>
            
            <div class="controles-paleta">
                <p>¿Cuántos colores necesitas?</p>
                <button class="btn-cantidad" data-cantidad="6">6</button>
                <button class="btn-cantidad" data-cantidad="8">8</button>
                <button class="btn-cantidad" data-cantidad="9">9</button>
                
                <button id="btn-generar" class="btn-principal">Generar Paleta</button>
            </div>

            <div id="contenedor-paleta" class="lienzo-paleta">
            </div>

            <button id="btn-guardar" class="btn-secundario">Guardar Paleta</button>
        </section>

    </main>

</body>
</html>
